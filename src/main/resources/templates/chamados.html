<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chamados - Sistema de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/web/dashboard"><i class="bi bi-headset"></i> SysChamados</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/web/dashboard">Dashboard</a>
            <a class="nav-link" href="/web/clientes">Clientes</a>
            <a class="nav-link" href="/web/categorias">Categorias</a>
            <a class="nav-link" href="/web/tecnicos">Técnicos</a>
            <a class="nav-link active" href="/web/chamados">Chamados</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row mb-3 align-items-center">
        <div class="col-md-6">
            <h2 class="fw-bold">Gestão de Chamados</h2>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="chamado : ${chamados}">
                    <td th:text="${chamado.id}">1</td>
                    <td th:text="${chamado.titulo}">Título do Chamado</td>
                    <td>
                        <span class="badge bg-warning text-dark" th:text="${chamado.prioridade}">MEDIA</span>
                    </td>
                    <td>
                        <span class="badge bg-info text-dark" th:text="${chamado.status}">ABERTO</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(chamados)}">
                    <td colspan="4" class="text-center text-muted py-3">Nenhum chamado registado.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
