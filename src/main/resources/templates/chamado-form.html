<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Chamado - Sistema de Chamados</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0 text-primary fw-bold">
                        <i class="bi bi-ticket-detailed me-2"></i>Abrir Novo Chamado
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form action="/web/chamados/novo" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Título do Problema</label>
                            <input type="text" class="form-control" name="titulo" placeholder="Ex: Computador não liga" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">ID do Cliente</label>
                                <input type="number" class="form-control" name="clienteId" placeholder="Ex: 1 (Empresa X)" required>
                                <div class="form-text">Geralmente 1 para o cliente inicial de teste.</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">ID da Categoria</label>
                                <input type="number" class="form-control" name="categoriaId" placeholder="Ex: 1 (Hardware)" required>
                                <div class="form-text">Geralmente 1 (Hardware) ou 2 (Redes).</div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Descrição Detalhada</label>
                            <textarea class="form-control" name="descricao" rows="4" placeholder="Descreva o que está a acontecer..." required></textarea>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="/web/dashboard" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i> Salvar Chamado
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
