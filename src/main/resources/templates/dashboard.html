<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Sistema de Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/web/dashboard"><i class="bi bi-headset"></i> SysChamados</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/web/dashboard">Dashboard</a>
            <a class="nav-link" href="/web/clientes">Clientes</a>
            <a class="nav-link" href="/web/categorias">Categorias</a>
            <a class="nav-link" href="/web/tecnicos">Técnicos</a>
            <a class="nav-link" href="/web/chamados">Chamados</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row mb-4">
        <div class="col-12">
            <h2 class="fw-bold text-dark">Painel de Controlo</h2>
            <p class="text-muted">Bem-vinda ao sistema de gestão de chamados de suporte técnico.</p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <div class="card text-white bg-primary shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-ticket-detailed"></i> Total de Chamados</h5>
                    <p class="card-text fs-2 fw-bold" th:text="${totalChamados}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card text-white bg-success shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-check-circle"></i> Estado do Sistema</h5>
                    <p class="card-text fs-4 fw-semibold">Operacional (DEV/H2)</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card text-white bg-secondary shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title"><i class="bi bi-database"></i> Consola H2</h5>
                    <p class="card-text"><a href="/h2-console" target="_blank" class="text-white text-decoration-underline fw-semibold">Abrir Base de Dados</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
